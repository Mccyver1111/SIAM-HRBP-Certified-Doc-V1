<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดทำสำเนาเอกสารปลอดภัย (PDPA Compliance)</title>

    <link rel="shortcut icon" href="icon-siam-hrbp.png" type="image/png">
    <link rel="icon" href="icon-siam-hrbp.png" type="image/png">
    <link rel="apple-touch-icon" href="icon-siam-hrbp.png">

    <meta property="og:type" content="website">
    <meta property="og:title" content="ระบบสร้างสำเนาเอกสารปลอดภัย - SIAM-HRBP">
    <meta property="og:description" content="ระบบจัดทำสำเนาเอกสารลบลายน้ำอัตโนมัติ ถูกต้องตามมาตราฐานขนาดจริง 100% (PDPA Compliant)">
    <meta property="og:image" content="icon-siam-hrbp.png">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript" id="opencv-js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between">

    <div class="container mx-auto max-w-4xl p-4 md:p-8">
        <header class="text-center mb-8">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-800 mb-2">ระบบสร้างสำเนาเอกสารปลอดภัย</h1>
            <p class="text-sm text-green-600 font-semibold flex justify-center items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                PDPA Compliant: แก้ไขระบบเรนเดอร์ PDF ตัวเนื้อหาหลักและลายน้ำครบถ้วน
            </p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <!-- ฝั่งควบคุมข้อมูล -->
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">1. อัปโหลดเอกสาร (รูปภาพ หรือ ไฟล์ PDF)</label>
                    <input type="file" id="fileInput" accept="image/*,application/pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">2. วัตถุประสงค์การใช้งาน</label>
                    <input type="text" id="purposeInput" value="ใช้สำหรับรับมอบอำนาจเข้าชี้แจงเกี่ยวกับสภาพการจ้างเท่านั้น" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">3. วันที่ใช้เอกสาร</label>
                    <input type="date" id="dateInput" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>

                <button id="generateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-md flex justify-center items-center gap-2 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    Gen & Save to PDF
                </button>
            </div>

            <!-- ฝั่งแสดงผล Preview -->
            <div class="flex flex-col items-center justify-center border-2 border-dashed border-gray-200 rounded-2xl p-4 bg-gray-50 min-h-[350px]">
                <span id="previewPlaceholder" class="text-gray-400 text-sm text-center">รูปภาพหรือข้อมูลไฟล์จะแสดงที่นี่<br><span class="text-xs text-gray-400">(ไฟล์ PDF จะแสดงพรีวิวตัวอย่างหน้าแรกที่นี่)</span></span>
                <div id="canvasContainer" class="relative hidden max-w-full overflow-hidden rounded-lg shadow-sm">
                    <canvas id="outputCanvas" class="max-w-full h-auto"></canvas>
                </div>
                <div id="pdfInfoBadge" class="mt-2 hidden bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">โหมดเอกสาร PDF: รวมร่างเนื้อหาเดิมพร้อมลายน้ำภาษาไทย</div>
            </div>
        </div>
    </div>

    <canvas id="sourceCanvas" class="hidden"></canvas>
    <canvas id="croppedCanvas" class="hidden"></canvas>
    <canvas id="hiddenWorkerCanvas" class="hidden"></canvas>

    <footer class="text-center py-4 text-xs text-gray-400 border-t border-gray-100 mt-8 bg-white w-full">
        @2024 Siam-HRBP Soft
    </footer>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        document.getElementById('dateInput').valueAsDate = new Date();

        const fileInput = document.getElementById('fileInput');
        const purposeInput = document.getElementById('purposeInput');
        const dateInput = document.getElementById('dateInput');
        const generateBtn = document.getElementById('generateBtn');
        const pdfInfoBadge = document.getElementById('pdfInfoBadge');
        
        const sourceCanvas = document.getElementById('sourceCanvas');
        const croppedCanvas = document.getElementById('croppedCanvas');
        const outputCanvas = document.getElementById('outputCanvas');
        const hiddenWorkerCanvas = document.getElementById('hiddenWorkerCanvas');
        
        let originalImage = null;
        let pdfDocInstance = null;
        let isPdfMode = false;

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.type === "application/pdf") {
                isPdfMode = true;
                pdfInfoBadge.classList.remove('hidden');
                
                const reader = new FileReader();
                reader.onload = async function(event) {
                    const typedarray = new Uint8Array(event.target.result);
                    pdfDocInstance = await pdfjsLib.getDocument(typedarray).promise;
                    renderPdfPageToPreview(1);
                };
                reader.readAsArrayBuffer(file);
            } else {
                isPdfMode = false;
                pdfInfoBadge.classList.add('hidden');
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    originalImage = new Image();
                    originalImage.onload = function() {
                        processImageAutoCrop();
                    };
                    originalImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        async function renderPdfPageToPreview(pageNumber) {
            if (!pdfDocInstance) return;
            const page = await pdfDocInstance.getPage(pageNumber);
            
            const viewport = page.getViewport({ scale: 2.0 });
            outputCanvas.width = viewport.width;
            outputCanvas.height = viewport.height;
            
            const ctx = outputCanvas.getContext('2d');
            
            // เคลียร์พื้นหลังให้เป็นสีขาวก่อนวาดเนื้อหา PDF
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);

            const renderContext = {
                canvasContext: ctx,
                viewport: viewport
            };
            
            // รอให้ข้อความและเอกสารเดิมถูกวาดจนเสร็จ
            await page.render(renderContext).promise;
            
            // แสตมป์ลายน้ำไทยทับลงไป
            drawWatermarkLayer(ctx, outputCanvas.width, outputCanvas.height);
            
            document.getElementById('previewPlaceholder').classList.add('hidden');
            document.getElementById('canvasContainer').classList.remove('hidden');
        }

        function processImageAutoCrop() {
            const srcCtx = sourceCanvas.getContext('2d');
            sourceCanvas.width = originalImage.width;
            sourceCanvas.height = originalImage.height;
            srcCtx.drawImage(originalImage, 0, 0);

            if (typeof cv !== 'undefined' && cv.Mat) {
                try {
                    let src = cv.imread(sourceCanvas);
                    let gray = new cv.Mat();
                    let blurred = new cv.Mat();
                    let edged = new cv.Mat();

                    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                    cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
                    cv.Canny(blurred, edged, 75, 200);

                    let contours = new cv.MatVector();
                    let hierarchy = new cv.Mat();
                    cv.findContours(edged, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                    let maxArea = 0;
                    let maxContourIndex = -1;

                    for (let i = 0; i < contours.size(); ++i) {
                        let area = cv.contourArea(contours.get(i));
                        if (area > maxArea) {
                            maxArea = area;
                            maxContourIndex = i;
                        }
                    }

                    if (maxContourIndex !== -1 && maxArea > (src.rows * src.cols * 0.15)) {
                        let rect = cv.boundingRect(contours.get(maxContourIndex));
                        croppedCanvas.width = rect.width;
                        croppedCanvas.height = rect.height;
                        const cropCtx = croppedCanvas.getContext('2d');
                        cropCtx.drawImage(sourceCanvas, rect.x, rect.y, rect.width, rect.height, 0, 0, rect.width, rect.height);
                    } else {
                        useOriginalImage();
                    }

                    src.delete(); gray.delete(); blurred.delete(); edged.delete();
                    contours.delete(); hierarchy.delete();
                } catch (err) {
                    useOriginalImage();
                }
            } else {
                useOriginalImage();
            }
            renderImagePreview();
        }

        function useOriginalImage() {
            croppedCanvas.width = sourceCanvas.width;
            croppedCanvas.height = sourceCanvas.height;
            const cropCtx = croppedCanvas.getContext('2d');
            cropCtx.drawImage(sourceCanvas, 0, 0);
        }

        function renderImagePreview() {
            if (!originalImage) return;
            
            outputCanvas.width = 1600;
            const scaleRatio = 1600 / croppedCanvas.width;
            outputCanvas.height = croppedCanvas.height * scaleRatio;
            
            const ctx = outputCanvas.getContext('2d');
            ctx.drawImage(croppedCanvas, 0, 0, outputCanvas.width, outputCanvas.height);

            drawWatermarkLayer(ctx, outputCanvas.width, outputCanvas.height);

            document.getElementById('previewPlaceholder').classList.add('hidden');
            document.getElementById('canvasContainer').classList.remove('hidden');
        }

        function wrapText(ctx, text, maxWidth) {
            let words = text.split('');
            let lines = [];
            let currentLine = '';

            for (let n = 0; n < words.length; n++) {
                let testLine = currentLine + words[n];
                let metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    lines.push(currentLine);
                    currentLine = words[n];
                } else {
                    currentLine = testLine;
                }
            }
            lines.push(currentLine);
            return lines;
        }

        function drawWatermarkLayer(ctx, canvasWidth, canvasHeight) {
            const purpose = purposeInput.value || "ใช้สำหรับรับมอบอำนาจเข้าชี้แจงเกี่ยวกับสภาพการจ้างเท่านั้น";
            let dateText = "";
            if (dateInput.value) {
                const d = new Date(dateInput.value);
                dateText = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear() + 543}`;
            }

            const fontSize = Math.max(24, Math.round(canvasWidth * 0.032));
            ctx.font = `bold ${fontSize}px 'Sarabun'`;
            
            const maxTextWidth = canvasWidth * 0.85;
            const lines = wrapText(ctx, purpose, maxTextWidth);

            const centerX = canvasWidth / 2;
            const centerY = canvasHeight / 2;
            const angle = -22 * Math.PI / 180; 
            
            const lineHeight = fontSize * 1.25;
            const baseSpacing = fontSize * 0.8;
            const dynamicSpacing = baseSpacing + (lines.length * lineHeight);

            let maxLineLen = 0;
            lines.forEach(line => {
                const w = ctx.measureText(line).width;
                if (w > maxLineLen) maxLineLen = w;
            });
            const lineLength = maxLineLen + 60;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angle);

            ctx.strokeStyle = "rgba(0, 40, 220, 0.75)"; 
            ctx.lineWidth = Math.max(3, Math.round(canvasWidth * 0.004));

            ctx.beginPath();
            ctx.moveTo(-lineLength / 2, -dynamicSpacing / 2);
            ctx.lineTo(lineLength / 2, -dynamicSpacing / 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-lineLength / 2, dynamicSpacing / 2);
            ctx.lineTo(lineLength / 2, dynamicSpacing / 2);
            ctx.stroke();

            ctx.fillStyle = "rgba(0, 30, 200, 0.85)";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const startY = -((lines.length - 1) * lineHeight) / 2;
            for (let i = 0; i < lines.length; i++) {
                ctx.fillText(lines[i], 0, startY + (i * lineHeight));
            }
            ctx.restore();

            ctx.save();
            ctx.fillStyle = "rgba(0, 30, 200, 0.85)";
            ctx.font = `bold ${fontSize}px 'Sarabun'`;
            ctx.textAlign = "center";
            
            const footerX = canvasWidth * 0.53;
            const footerYStart = centerY + (dynamicSpacing / 2) + (fontSize * 1.5);

            ctx.fillText("สำเนาถูกต้อง", footerX, footerYStart);
            ctx.fillText(dateText, footerX, footerYStart + (fontSize * 1.25));
            ctx.restore();
        }

        purposeInput.addEventListener('input', () => {
            if (isPdfMode) renderPdfPageToPreview(1);
            else renderImagePreview();
        });
        
        dateInput.addEventListener('change', () => {
            if (isPdfMode) renderPdfPageToPreview(1);
            else renderImagePreview();
        });

        generateBtn.addEventListener('click', async () => {
            if (isPdfMode) {
                if (!pdfDocInstance) return;
                
                // เปลี่ยนข้อความปุ่มระหว่างประมวลผลเซฟไฟล์
                generateBtn.disabled = true;
                generateBtn.innerText = "กำลังประมวลผลเอกสาร...";
                
                await exportMultiPagePdf();
                
                generateBtn.disabled = false;
                generateBtn.innerText = "Gen & Save to PDF";
            } else {
                if (!originalImage) {
                    alert("กรุณาอัปโหลดรูปภาพ หรือไฟล์ PDF ก่อนครับ");
                    return;
                }
                exportImageToPdf();
            }
        });

        function exportImageToPdf() {
            const { jsPDF } = window.jspdf;
            const orientation = outputCanvas.width >= outputCanvas.height ? 'l' : 'p';
            const pdf = new jsPDF(orientation, 'mm', 'a4');
            
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            const canvasRatio = outputCanvas.width / outputCanvas.height;
            
            let printWidth = pageWidth - 20;
            let printHeight = printWidth / canvasRatio;
            
            if (printHeight > (pageHeight - 20)) {
                printHeight = pageHeight - 20;
                printWidth = printHeight * canvasRatio;
            }
            
            const xOffset = (pageWidth - printWidth) / 2;
            const yOffset = (pageHeight - printHeight) / 2;
            
            const imgData = outputCanvas.toDataURL('image/jpeg', 0.95);
            pdf.addImage(imgData, 'JPEG', xOffset, yOffset, printWidth, printHeight);
            pdf.save('Certified_Document.pdf');
        }

        // คีย์หลักในการแก้ไขปัญหา: ลูปประมวลผลรอเรนเดอร์เนื้อหาทีละหน้าแบบ Sync ครบถ้วน
        async function exportMultiPagePdf() {
            const { jsPDF } = window.jspdf;
            let finalPdf = null;
            
            const totalPages = pdfDocInstance.numPages;
            const workerCtx = hiddenWorkerCanvas.getContext('2d');
            
            for (let i = 1; i <= totalPages; i++) {
                const page = await pdfDocInstance.getPage(i);
                
                // ใช้ Scale 2.0 ในการแปลงหน้าไฟล์จริงเพื่อรักษาความละเอียดเนื้อเอกสาร
                const viewport = page.getViewport({ scale: 2.0 });
                hiddenWorkerCanvas.width = viewport.width;
                hiddenWorkerCanvas.height = viewport.height;
                
                // รีเซ็ตล้างพื้นหลังเป็นสีขาวให้พนักงานก่อนเรนเดอร์ข้อความเอกสาร
                workerCtx.fillStyle = '#ffffff';
                workerCtx.fillRect(0, 0, hiddenWorkerCanvas.width, hiddenWorkerCanvas.height);
                
                const renderContext = {
                    canvasContext: workerCtx,
                    viewport: viewport
                };
                
                // บังคับให้ขบวนการวาดเนื้อความ PDF ดั้งเดิมเสร็จสิ้นเรียบร้อย (หัวใจสำคัญในการแก้บั๊ก)
                await page.render(renderContext).promise;
                
                // นำเลเยอร์ข้อความไทยคาดกลางมาประทับทับลงบนเนื้อหานั้นๆ
                drawWatermarkLayer(workerCtx, hiddenWorkerCanvas.width, hiddenWorkerCanvas.height);
                
                const pageOrientation = hiddenWorkerCanvas.width >= hiddenWorkerCanvas.height ? 'l' : 'p';
                
                if (i === 1) {
                    finalPdf = new jsPDF(pageOrientation, 'mm', 'a4');
                } else {
                    finalPdf.addPage('a4', pageOrientation);
                }
                
                const pWidth = finalPdf.internal.pageSize.getWidth();
                const pHeight = finalPdf.internal.pageSize.getHeight();
                
                // ดึงภาพรวมร่าง (เนื้อหาเดิม + ลายน้ำคาดกลาง) ใส่เข้าชุดหน้ากระดาษ PDF
                const imgData = hiddenWorkerCanvas.toDataURL('image/jpeg', 0.92);
                finalPdf.addImage(imgData, 'JPEG', 0, 0, pWidth, pHeight);
            }
            
            if (finalPdf) {
                finalPdf.save('Certified_Document_MultiPage.pdf');
            }
        }
    </script>
</body>
</html>
